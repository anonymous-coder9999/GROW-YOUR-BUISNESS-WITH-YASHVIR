<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GROW BUISNESS</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404 pages to root with path preserved
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      var pathSegmentsToKeep = (repoName && repoName.toLowerCase().endsWith('.github.io')) ? 0 : 1;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
