<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GROW BUISNESS - Scale Your Small Business Globally</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // GitHub Pages trailing slash fix: ensures relative assets like ./assets/ load correctly
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.includes('.') && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();

      // Single Page App path decoder for GitHub Pages
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname : l.pathname + '/';
          window.history.replaceState(null, null,
            basePath + decoded + l.hash
          );
        }
      })(window.location);

      // Global runtime error handler
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.hasChildNodes() || root.querySelector('.app-loader'))) {
          var errorMsg = e.message || (e.error && e.error.message) || 'Failed to load script module or asset';
          root.innerHTML = '<div style="min-height:100vh;background:#09090b;color:#fff;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif;text-align:center;"><div style="max-width:28rem;background:#18181b;border:1px solid #ef4444;padding:2rem;border-radius:1rem;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);"><h1 style="font-size:1.25rem;font-weight:bold;color:#f87171;margin-bottom:0.5rem;">GROW BUISNESS</h1><p style="font-size:0.875rem;color:#d4d4d8;margin-bottom:1rem;">A startup error occurred. Please refresh or check connection:</p><pre style="font-size:0.75rem;color:#fca5a5;background:#27272a;padding:0.75rem;border-radius:0.5rem;text-align:left;overflow-x:auto;white-space:pre-wrap;">' + errorMsg + '</pre><button onclick="window.location.reload()" style="margin-top:1rem;padding:0.5rem 1.25rem;background:#ffffff;color:#000000;font-weight:bold;border-radius:0.5rem;border:none;cursor:pointer;">Reload Page</button></div></div>';
        }
      });
    </script>
  </head>
  <body class="bg-black text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden">
    <div id="root">
      <div class="app-loader" style="min-height: 100vh; background-color: #09090b; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 2rem; font-family: system-ui, -apple-system, sans-serif; text-align: center;">
        <div style="max-width: 28rem; background: #18181b; border: 1px solid #27272a; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
          <div style="width: 2.5rem; height: 2.5rem; margin: 0 auto 1.25rem; border: 3px solid #06b6d4; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
          <h1 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem; color: #ffffff; letter-spacing: 0.05em;">GROW BUISNESS</h1>
          <p style="font-size: 0.875rem; color: #a1a1aa;">Scaling Small Businesses Globally...</p>
        </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
